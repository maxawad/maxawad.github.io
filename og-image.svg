<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Max Awad — Staff Engineer, Contract & Fractional">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0e17"/>
      <stop offset="1" stop-color="#17161f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="0%" r="60%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="10%" r="55%">
      <stop offset="0" stop-color="#ff7a59" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff7a59" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- Eyebrow (kept short so it never collides with the domain, top-right) -->
    <text x="80" y="150" fill="#a78bfa" font-size="26" font-weight="700" letter-spacing="2">STAFF ENGINEER &#8226; CONTRACT &amp; FRACTIONAL</text>

    <!-- Domain, top-right -->
    <text x="1120" y="150" fill="#a5a1b8" font-size="26" font-weight="500" text-anchor="end">maxawad.com</text>

    <!-- Name -->
    <text x="76" y="272" fill="#eae8f2" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-weight="700" letter-spacing="-2">Max Awad</text>

    <!-- Value line -->
    <text x="80" y="352" fill="#eae8f2" font-size="42" font-weight="700">AI agents &amp; the platforms behind them.</text>

    <!-- Supporting lines -->
    <text x="80" y="412" fill="#a5a1b8" font-size="29" font-weight="400">~13 yrs across Apple &#8226; Google &#8226; Meta &#8226; NYC / US-remote</text>
    <text x="80" y="452" fill="#a5a1b8" font-size="29" font-weight="400">Python &amp; TypeScript &#8226; agents, RAG/MCP, evaluation, backend platforms</text>

    <!-- Skill pills -->
    <g font-size="24" font-weight="500">
      <rect x="80" y="500" width="150" height="52" rx="26" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.10)"/>
      <text x="155" y="533" fill="#eae8f2" text-anchor="middle">Agents</text>

      <rect x="246" y="500" width="120" height="52" rx="26" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.10)"/>
      <text x="306" y="533" fill="#eae8f2" text-anchor="middle">RAG</text>

      <rect x="382" y="500" width="120" height="52" rx="26" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.10)"/>
      <text x="442" y="533" fill="#eae8f2" text-anchor="middle">MCP</text>

      <rect x="518" y="500" width="200" height="52" rx="26" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.10)"/>
      <text x="618" y="533" fill="#eae8f2" text-anchor="middle">Evaluation</text>
    </g>

    <!-- Rate anchor -->
    <text x="1120" y="533" fill="#2dd4bf" font-size="30" font-weight="700" text-anchor="end">$150+/hr</text>
  </g>
</svg>
